# Produção em uma VPS: HTTPS (Caddy) + app + PostgreSQL + agendador de rotinas.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: "${DOMAIN:?defina DOMAIN no .env}"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carvex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: carvex
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carvex"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://carvex:${POSTGRES_PASSWORD}@db:5432/carvex?schema=public
      DATA_DIR: /data
    volumes: [appdata:/data]
    expose: ["3000"]

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on: [app]
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 900; curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron >/dev/null || echo cron-falhou; done"]

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
